
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Student Task Tracker</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
            color: #272343;
        }

        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 32px 24px;
            overflow-x: hidden;
            background:
                radial-gradient(circle at top left, #e2d9ff, transparent 45%),
                linear-gradient(135deg, #f6f3ff, #eef0ff, #faf8ff);
        }

        .auth-card {
            width: 100%;
            max-width: 440px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.96);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(71, 53, 130, 0.13);
        }

        .auth-logo {
            width: 64px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 22px;
            border-radius: 20px;
            background: linear-gradient(135deg, #7959ed, #a18aff);
            color: white;
            font-size: 30px;
            font-weight: 800;
            box-shadow: 0 8px 20px rgba(107, 76, 230, 0.25);
        }

        .auth-card h1 {
            margin: 0 0 10px;
            text-align: center;
            font-size: 29px;
            letter-spacing: -0.8px;
        }

        .subtitle {
            margin: 0 0 30px;
            text-align: center;
            color: #858198;
            font-size: 14px;
            line-height: 1.6;
        }

        .auth-form {
            display: grid;
            gap: 20px;
        }

        .auth-form label {
            display: block;
            margin-bottom: 9px;
            color: #39344f;
            font-size: 14px;
            font-weight: 650;
        }

        .auth-form input {
            width: 100%;
            padding: 14px 15px;
            border: 1px solid #e4e0ef;
            border-radius: 12px;
            background: #fcfbff;
            color: #272343;
            font: inherit;
            font-size: 14px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .auth-form input::placeholder {
            color: #aaa6ba;
        }

        .auth-form input:focus {
            outline: none;
            border-color: #8062ee;
            box-shadow: 0 0 0 4px rgba(128, 98, 238, 0.12);
            background: #fff;
        }

        .auth-button {
            width: 100%;
            margin-top: 5px;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #7050e8, #8c70f3);
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 7px 18px rgba(112, 80, 232, 0.22);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .auth-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 11px 24px rgba(112, 80, 232, 0.3);
        }

        .auth-button:active {
            transform: translateY(0);
        }

        .auth-footer {
            margin: 26px 0 0;
            text-align: center;
            color: #858198;
            font-size: 14px;
            line-height: 1.6;
        }

        .auth-footer a {
            color: #7050e8;
            font-weight: 700;
            text-decoration: none;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .flash-message {
            margin-bottom: 18px;
            padding: 12px 14px;
            border-radius: 10px;
            background: #fff0f0;
            color: #a52828;
            font-size: 14px;
            line-height: 1.5;
        }

        .flash-success {
            background: #eaf8ee;
            color: #206b37;
        }

        .auth-brand {
            margin-top: 25px;
            text-align: center;
            color: #aaa5bd;
            font-size: 11px;
            letter-spacing: 1.5px;
            font-weight: 700;
        }

        @media (max-width: 480px) {
            .auth-page {
                padding: 20px 14px;
            }

            .auth-card {
                padding: 30px 23px;
                border-radius: 20px;
            }

            .auth-card h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>
    <main class="auth-page">
        <section class="auth-card">
            <div class="auth-logo">✓</div>

            <h1>Welcome back!</h1>

            <p class="subtitle">
                Sign in to stay organised and keep your studies on track.
            </p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                    <div class="flash-message {% if category == 'success' %}flash-success{% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endwith %}

            <form class="auth-form"
                  method="POST"
                  action="{{ url_for('login') }}">

                <div>
                    <label for="email">Email address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required>
                </div>

                <div>
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required>
                </div>

                <button type="submit" class="auth-button">
                    Sign In
                </button>
            </form>

            <p class="auth-footer">
                Don't have an account?
                <a href="{{ url_for('register') }}">Create account</a>
            </p>

            <div class="auth-brand">
                STUDENT TASK TRACKER
            </div>
        </section>
    </main>
</body>
</html>
